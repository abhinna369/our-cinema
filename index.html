<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="Our Cinema — Stories worth watching."
    >

    <title>Our Cinema</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ==============================
         CINEMATIC INTRO
    =============================== -->

    <main id="cinema">

        <div class="cinema-glow"></div>

        <div class="film-grain"></div>

        <div class="cinema-lines"></div>


        <section class="hero">

            <p class="eyebrow">
                A PLACE FOR STORIES
            </p>

            <h1>
                OUR
                <span>CINEMA</span>
            </h1>

            <div class="divider"></div>

            <p class="subtitle">
                STORIES WORTH WATCHING
            </p>


            <button
                id="enterCinema"
                class="enter-button"
                type="button"
            >

                <span class="button-text">
                    ENTER CINEMA
                </span>

                <span class="button-arrow">
                    →
                </span>

            </button>

        </section>


        <footer class="hero-footer">

            <span>
                PRIVATE COLLECTION
            </span>

            <span>
                EST. 2026
            </span>

        </footer>

    </main>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="script.js"></script>

</body>

</html>
