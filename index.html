<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="Our Cinema — our personal collection of movies and stories."
    >

    <title>Our Cinema</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================================
         CINEMATIC INTRO
    ========================================== -->

    <section
        id="intro"
        aria-label="Our Cinema"
    >

        <div class="intro-background"></div>

        <div class="intro-noise"></div>

        <div class="intro-content">

            <p class="intro-overline">
                A PLACE FOR STORIES
            </p>

            <h1 class="intro-title">
                OUR CINEMA
            </h1>

            <div class="intro-divider"></div>

            <p class="intro-subtitle">
                STORIES WORTH WATCHING
            </p>

        </div>

        <div class="intro-corner intro-corner-top"></div>
        <div class="intro-corner intro-corner-bottom"></div>

    </section>


    <!-- =========================================
         MAIN CINEMA
    ========================================== -->

    <main id="cinema">

        <header class="cinema-header">

            <div class="header-left">

                <div class="brand-mark">
                    OC
                </div>

                <div>

                    <h1 class="brand">
                        Our Cinema
                    </h1>

                    <p class="tagline">
                        Stories worth watching.
                    </p>

                </div>

            </div>

            <div class="header-right">

                <span class="collection-label">
                    OUR COLLECTION
                </span>

                <span
                    class="movie-count"
                    id="movieCount"
                >
                    00
                </span>

            </div>

        </header>


        <!-- =====================================
             MOVIE COLLECTION
        ====================================== -->

        <section
            class="movie-section"
            aria-label="Movie collection"
        >

            <div
                id="movieGrid"
                class="movie-grid"
            >

                <!--
                ==================================================
                MOVIES

                Copy this complete article whenever you add a movie.

                Example:

                <article
                    class="movie-card"
                    data-video="videos/movie.mp4"
                >

                    <div class="poster-wrapper">

                        <img
                            src="posters/movie.jpg"
                            alt="Movie name poster"
                            loading="lazy"
                        >

                        <div class="poster-shade"></div>

                        <div class="play-overlay">

                            <span class="play-circle">

                                <span class="play-icon"></span>

                            </span>

                        </div>

                    </div>

                    <div class="movie-info">

                        <h2 class="movie-title">
                            Movie Name
                        </h2>

                        <p class="movie-meta">
                            2026
                        </p>

                    </div>

                </article>
                ==================================================
                -->

            </div>


            <!-- EMPTY COLLECTION MESSAGE -->

            <div
                id="emptyCollection"
                class="empty-collection"
            >

                <div class="empty-icon">
                    +
                </div>

                <p class="empty-title">
                    Your cinema is waiting.
                </p>

                <p class="empty-text">
                    Add your first movie to begin the collection.
                </p>

            </div>

        </section>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="cinema-footer">

            <div class="footer-line"></div>

            <p>
                OUR CINEMA
            </p>

            <span>
                A COLLECTION OF STORIES
            </span>

        </footer>

    </main>


    <!-- =========================================
         FULLSCREEN VIDEO PLAYER
    ========================================== -->

    <section
        id="player"
        class="player"
        aria-hidden="true"
    >

        <div class="player-background"></div>

        <button
            id="closePlayer"
            class="close-player"
            type="button"
            aria-label="Close video"
        >
            <span></span>
            <span></span>
        </button>

        <div class="player-content">

            <video
                id="video"
                playsinline
                controls
                preload="metadata"
            ></video>

        </div>

    </section>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
