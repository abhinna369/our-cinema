<!DOCTYPE html>
<html lang="en">
<head>

    <!-- =========================
         BASIC DOCUMENT SETTINGS
    ========================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="Our Cinema — a personal collection of movies, anime and stories."
    >

    <title>Our Cinema</title>


    <!-- =========================
         STYLESHEET
    ========================== -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==================================================
         CINEMATIC INTRO
    =================================================== -->

    <section
        id="intro"
        aria-label="Our Cinema introduction"
    >

        <div class="intro-content">

            <div class="intro-small">
                A Little Place For Stories
            </div>

            <h1 class="intro-title">
                Our Cinema
            </h1>

            <div class="intro-line"></div>

            <p class="intro-subtitle">
                Stories Worth Watching
            </p>

        </div>

    </section>



    <!-- ==================================================
         MAIN CINEMA
    =================================================== -->

    <main id="cinema">


        <!-- =========================
             CINEMA HEADER
        ========================== -->

        <header class="cinema-header">

            <div>

                <h1 class="brand">
                    Our Cinema
                </h1>

                <p class="tagline">
                    Stories worth watching
                </p>

            </div>


            <div class="cinema-count">
                YOUR COLLECTION
            </div>

        </header>



        <!-- ==================================================
             MOVIE COLLECTION

             New movies will be added inside this section.

             Example structure:

             <article
                 class="movie-card"
                 data-video="videos/movie.mp4"
             >

                 <div class="poster-wrapper">

                     <img
                         src="posters/movie.jpg"
                         alt="Movie poster"
                     >

                     <div class="play-overlay">

                         <div class="play-button"></div>

                     </div>

                 </div>

                 <div class="movie-info">

                     <h2 class="movie-title">
                         Movie Name
                     </h2>

                     <p class="movie-year">
                         2026
                     </p>

                 </div>

             </article>

        =================================================== -->

        <section
            class="movie-grid"
            aria-label="Movie collection"
        >

            <!--
                MOVIES WILL BE ADDED HERE.
            -->

        </section>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="cinema-footer">

            Our Cinema

        </footer>


    </main>



    <!-- ==================================================
         FULL-SCREEN VIDEO PLAYER
    =================================================== -->

    <section
        id="player"
        aria-label="Video player"
    >

        <button
            class="close-player"
            type="button"
            aria-label="Close video player"
        >
            ×
        </button>


        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        >
        </video>

    </section>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script src="script.js"></script>


</body>
</html>
