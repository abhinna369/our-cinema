<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Cinema</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        color: white;
    }

    /* =========================
       CINEMATIC INTRO
    ========================== */

    #intro {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(
                circle at center,
                #171717 0%,
                #090909 42%,
                #020202 100%
            );
        overflow: hidden;
    }

    /* Moving cinematic glow */

    .glow {
        position: absolute;
        width: 45vw;
        height: 45vw;
        max-width: 320px;
        max-height: 320px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07);
        filter: blur(70px);
        animation: glowMove 4s ease-in-out infinite alternate;
    }

    @keyframes glowMove {
        from {
            transform: scale(0.65);
            opacity: 0.25;
        }

        to {
            transform: scale(1.25);
            opacity: 0.7;
        }
    }

    /* Original cinema mark */

    .cinema-mark {
        position: relative;
        width: 90px;
        height: 90px;
        border: 1px solid rgba(255,255,255,0.65);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0);
        animation: markAppear 1.5s cubic-bezier(.2,.8,.2,1) forwards;
        animation-delay: 0.7s;
    }

    .cinema-mark::before {
        content: "";
        position: absolute;
        width: 58px;
        height: 58px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 50%;
    }

    .cinema-mark::after {
        content: "✦";
        font-size: 27px;
        color: white;
        opacity: 0;
        animation: starAppear 1s ease forwards;
        animation-delay: 1.7s;
    }

    @keyframes markAppear {
        0% {
            transform: scale(0) rotate(-90deg);
            opacity: 0;
        }

        70% {
            transform: scale(1.12) rotate(8deg);
            opacity: 1;
        }

        100% {
            transform: scale(1) rotate(0);
            opacity: 1;
        }
    }

    @keyframes starAppear {
        from {
            opacity: 0;
            transform: scale(0.3);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Text */

    .intro-text {
        position: absolute;
        bottom: 22%;
        width: 100%;
        text-align: center;
        padding: 0 25px;
        opacity: 0;
        transform: translateY(15px);
        animation: textAppear 1.5s ease forwards;
        animation-delay: 2.2s;
    }

    .intro-small {
        font-size: 10px;
        letter-spacing: 6px;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 14px;
    }

    .intro-title {
        font-size: clamp(27px, 8vw, 48px);
        font-weight: 300;
        letter-spacing: 7px;
        text-transform: uppercase;
    }

    @keyframes textAppear {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Cinematic horizontal lines */

    .line {
        position: absolute;
        height: 1px;
        width: 0;
        background: rgba(255,255,255,0.25);
        animation: lineGrow 1.8s ease forwards;
    }

    .line.left {
        left: 0;
        top: 50%;
        animation-delay: 1.1s;
    }

    .line.right {
        right: 0;
        top: 50%;
        animation-delay: 1.1s;
    }

    @keyframes lineGrow {
        from {
            width: 0;
        }

        to {
            width: 24vw;
        }
    }

    /* =========================
       MAIN CINEMA PAGE
    ========================== */

    #cinema {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        background:
            radial-gradient(
                circle at top,
                #202020 0%,
                #0c0c0c 38%,
                #050505 100%
            );

        opacity: 0;
        transform: scale(1.03);
        transition:
            opacity 1.3s ease,
            transform 1.3s ease;

        pointer-events: none;
    }

    #cinema.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
    }

    .cinema-header {
        padding: 70px 24px 35px;
        text-align: center;
    }

    .cinema-label {
        font-size: 9px;
        letter-spacing: 5px;
        text-transform: uppercase;
        opacity: 0.45;
        margin-bottom: 15px;
    }

    .cinema-title {
        font-size: 38px;
        font-weight: 300;
        letter-spacing: 3px;
    }

    .cinema-subtitle {
        margin-top: 12px;
        font-size: 13px;
        color: rgba(255,255,255,0.55);
    }

    .divider {
        width: 55px;
        height: 1px;
        background: rgba(255,255,255,0.35);
        margin: 25px auto;
    }

    .empty-message {
        margin: 60px 25px;
        text-align: center;
        color: rgba(255,255,255,0.45);
        line-height: 1.8;
        font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

        .cinema-mark {
            width: 80px;
            height: 80px;
        }

        .cinema-mark::before {
            width: 52px;
            height: 52px;
        }

        .intro-small {
            font-size: 8px;
            letter-spacing: 4px;
        }

        .intro-title {
            letter-spacing: 5px;
        }

        .line.left,
        .line.right {
            width: 18vw;
        }

        .cinema-header {
            padding-top: 65px;
        }
    }
</style>
</head>

<body>

<!-- =========================
     CINEMATIC INTRO
========================== -->

<section id="intro">

    <div class="glow"></div>

    <div class="line left"></div>
    <div class="line right"></div>

    <div class="cinema-mark"></div>

    <div class="intro-text">
        <div class="intro-small">
            A little place for stories
        </div>

        <div class="intro-title">
            Let's Entertain
        </div>
    </div>

</section>


<!-- =========================
     OUR CINEMA
========================== -->

<main id="cinema">

    <header class="cinema-header">

        <div class="cinema-label">
            Welcome
        </div>

        <h1 class="cinema-title">
            Our Cinema
        </h1>

        <div class="divider"></div>

        <p class="cinema-subtitle">
            Stories worth watching.
        </p>

    </header>

    <div class="empty-message">
        Your collection is getting ready.
        <br><br>
        Movies &nbsp;•&nbsp; Anime &nbsp;•&nbsp; Stories
    </div>

</main>


<script>

    /*
       The intro automatically disappears
       after the cinematic animation.
    */

    window.addEventListener("load", function () {

        setTimeout(function () {

            const intro = document.getElementById("intro");
            const cinema = document.getElementById("cinema");

            intro.style.transition =
                "opacity 1.2s ease, transform 1.2s ease";

            intro.style.opacity = "0";
            intro.style.transform = "scale(1.08)";

            setTimeout(function () {

                intro.style.display = "none";

                cinema.classList.add("active");

            }, 1200);

        }, 5000);

    });

</script>

</body>
</html>
